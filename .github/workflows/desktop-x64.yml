name: Desktop x64 packages
on:
  push:
    branches: [feat/windows-linux-x64]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: desktop-x64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: go1.27.3
      GOMAXPROCS: "3"
      BAMBOO_VERSION: 0.1.0-x64.preview.1
      BAMBOO_VAULT_TEST: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.4"
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 libsecret-1-dev gnome-keyring dbus-x11 xvfb xdg-utils
      - name: Windows native compiler and installer
        if: runner.os == 'Windows'
        run: |
          echo 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"
          choco install nsis --yes --no-progress
      - name: Build release and separate acceptance binaries
        run: |
          npm ci
          python scripts/build-desktop.py
          git diff --exit-code -- frontend/src/mygo.ts
      - name: Frontend regression tests
        run: npm run test:web
      - name: Linux release tests and native acceptance
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash scripts/test-linux-desktop.sh
      - name: Windows release tests and native acceptance
        if: runner.os == 'Windows'
        run: |
          python scripts/go-release.py test -p=1 -count=1 -timeout=300s . ./internal/... ./cmd/...
          python scripts/desktop-platform-smoke.py
      - name: Package tested desktop binaries
        run: python scripts/package-desktop.py
      - name: Upload native packages and evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bamboo-${{ runner.os }}-x64-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/releases/
            artifacts/platform-smoke/desktop-smoke.json
            artifacts/platform-smoke/process.log
            artifacts/platform-smoke/*.png
