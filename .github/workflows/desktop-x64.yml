name: Desktop x64 packages
on:
  push:
    # Feature branches are covered by pull_request, without a second push run.
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      verify-published:
        description: Download and install the public assets instead of building
        type: boolean
        default: false
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  # Supersede old commits within an event, but never let a manual branch run
  # cancel the checks requested by a PR, main push or merge queue.
  group: desktop-x64-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    uses: ./.github/workflows/scope.yml

  native:
    name: Native desktop (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.scope != 'website'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: go1.27.3
      GOMAXPROCS: "3"
      BAMBOO_VAULT_TEST: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select exact package version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then export BAMBOO_VERSION="$REQUESTED_VERSION"; fi
          version=$(python scripts/release_version.py)
          echo "BAMBOO_VERSION=$version" >> "$GITHUB_ENV"
      - if: ${{ !inputs.verify-published }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.4"
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # setup-go caches the entire module/build caches, including large
          # native archives. Keep npm caching without caching DuckDB binaries.
          cache: false
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 libsecret-1-dev gnome-keyring dbus-x11 xvfb xdg-utils xdotool
      - name: Windows native compiler and installer
        if: ${{ runner.os == 'Windows' && !inputs.verify-published }}
        run: |
          printf '%s\n' 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"
          choco install nsis --yes --no-progress
      - name: Build release and separate acceptance binaries
        if: ${{ !inputs.verify-published }}
        run: |
          npm ci --prefer-offline
          python -m pip install -r requirements-build.txt
          python scripts/build-desktop.py
          git diff --exit-code -- frontend/src/mygo.ts
      - name: Linux release tests and native acceptance
        if: ${{ runner.os == 'Linux' && !inputs.verify-published }}
        run: |
          xvfb-run -a dbus-run-session -- bash scripts/test-linux-desktop.sh
      - name: Windows release tests and native acceptance
        if: ${{ runner.os == 'Windows' && !inputs.verify-published }}
        run: |
          python scripts/go-release.py test -v -p=1 -count=1 -timeout=180s . ./internal/... ./cmd/...
          python scripts/desktop-platform-smoke.py
      - name: Repeat native spill-budget regression
        if: ${{ !inputs.verify-published }}
        run: python scripts/go-release.py test -p=1 -run '^(TestSpillJoinAndGroup|TestDiskSpillAndRecovery|TestSpillFileSizeWhileWriterOpen)$' -count=5 -timeout=180s -v ./internal/engine
      - name: Package tested desktop binaries
        if: ${{ !inputs.verify-published }}
        run: python scripts/package-desktop.py
      - name: Download published packages
        env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ inputs.verify-published }}
        run: python scripts/download-desktop-release.py
      - name: Verify Linux packages and installed startup
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- python scripts/verify-desktop-package.py
      - name: Verify Windows packages and installed startup
        if: runner.os == 'Windows'
        run: python scripts/verify-desktop-package.py
      - name: Upload verified release assets
        if: ${{ !inputs.verify-published }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ runner.os }}-x64
          overwrite: true
          path: build/releases/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bamboo-${{ runner.os }}-x64-${{ inputs.verify-published && 'published' || 'build' }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/platform-smoke/desktop-smoke.json
            artifacts/platform-smoke/process.log
            artifacts/platform-smoke/*.png
            artifacts/platform-smoke/display*/desktop-smoke.json
            artifacts/platform-smoke/display*/process.log
            artifacts/platform-smoke/display*/*.png
            artifacts/package-smoke/*.json
            artifacts/package-smoke/*.log

  desktop:
    # Stable required-check names. Website-only runs do not claim native coverage.
    name: desktop (${{ matrix.os }})
    needs: [scope, native]
    if: ${{ always() }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require the selected native validation
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE: ${{ needs.scope.outputs.scope }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$SCOPE" in
            full) test "$NATIVE_RESULT" = success ;;
            website) test "$NATIVE_RESULT" = skipped
              echo "Website-only diff; native validation is not required." ;;
            *) exit 1 ;;
          esac
