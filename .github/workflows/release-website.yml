name: Release website sync

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Release run ID to verify and synchronize
        required: true
        type: string
      dry_run:
        description: Verify without creating a branch, PR or deployment
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-website-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'OldPanda/bamboo' &&
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' ||
       github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      # Run trusted default-branch code, never code/artifacts from the release run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.4"
      - name: Verify release, check catalog PR and merge
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_APP_ID: ${{ vars.SYNC_APP_ID }}
          SYNC_APP_INSTALLATION_ID: ${{ vars.SYNC_APP_INSTALLATION_ID }}
          SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id || inputs.release_run_id }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          COALESCE_RELEASES: ${{ github.event_name == 'workflow_run' }}
        run: node website/scripts/sync-release.mjs
