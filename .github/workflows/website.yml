name: Website

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Website build and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.4"
      - name: Test website build boundaries
        run: npm --prefix website run test:build
      - name: Build public files and standalone preview
        run: node website/scripts/website-build.mjs --standalone
      - name: Verify built website with production headers
        env:
          BAMBOO_CHROME: /usr/bin/google-chrome
        run: node website/scripts/website-smoke.mjs
      - name: Upload deployable site
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bamboo-website
          path: build/website/
          if-no-files-found: error
          retention-days: 7
      - name: Upload standalone preview and test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bamboo-website-review
          path: |
            build/bamboo-website-preview.html
            artifacts/website/
          retention-days: 7
