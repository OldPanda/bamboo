name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    uses: ./.github/workflows/macos.yml

  quality:
    # Preserve the existing status-check context for branch protection.
    name: PR quality gate
    needs: macos
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require successful macOS checks
        env:
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          if [ "$MACOS_RESULT" != success ]; then
            echo "::error::macOS checks did not succeed ($MACOS_RESULT)."
            exit 1
          fi
